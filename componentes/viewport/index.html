<!DOCTYPE html>
<html><head><meta charset="utf-8"></head><body style="margin:0">
<script>
/* Componente mínimo de Streamlit: reporta el ancho (px CSS) de la ventana del
   navegador y vuelve a reportarlo si la ventana cambia de tamaño o se mueve a
   otro monitor. No requiere instalar paquetes externos. */
function enviar(tipo, datos) {
  window.parent.postMessage(Object.assign({isStreamlitMessage: true, type: tipo}, datos), "*");
}
var ultimo = 0, temporizador = null;
function ancho() {
  try { return window.parent.innerWidth; } catch (e) { return window.innerWidth || screen.width; }
}
function reportar() {
  var w = Math.round(ancho() / 32) * 32;          // pasos de 32 px: evita reruns innecesarios
  if (w > 0 && w !== ultimo) { ultimo = w; enviar("streamlit:setComponentValue", {value: w, dataType: "json"}); }
}
function alCambiar() { clearTimeout(temporizador); temporizador = setTimeout(reportar, 350); }
enviar("streamlit:componentReady", {apiVersion: 1});
enviar("streamlit:setFrameHeight", {height: 0});
window.addEventListener("message", function (e) { if (e.data && e.data.type === "streamlit:render") reportar(); });
try { window.parent.addEventListener("resize", alCambiar); } catch (e) { window.addEventListener("resize", alCambiar); }
</script></body></html>
